<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Clone</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 1:2 aspect keeps cells square; height fits the window minus the panel's width */
  canvas { background: #111; aspect-ratio: 1 / 2; height: min(calc(100vh - 32px), calc((100vw - 200px) * 2)); }
  #panel { margin-left: 16px; color: #eee; font: 16px monospace; min-width: 120px; }
  #panel div { margin-bottom: 12px; }
  #panel span { display: block; font-size: 24px; }
</style>
</head>
<body>
<canvas id="playfield"></canvas>
<canvas id="next" width="120" height="120" style="align-self:flex-start;margin:16px"></canvas>
<div id="panel">
  <div>SCORE<span id="score">0</span></div>
  <div>LEVEL<span id="level">0</span></div>
  <div>LINES<span id="lines">0</span></div>
  <div>HIGH SCORE<span id="highscore">0</span></div>
</div>
<script>
﻿// Pure game logic: no DOM, no globals. Public interface:
//   newGame(random)            -> state
//   update(state, event, random) -> next state   (never mutates `state`)
// `random` is an injectable function returning a number in [0, 1).
// This file is both required by Node tests and inlined into the browser page.

const WIDTH = 10;
const HEIGHT = 20;
const TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

const COLORS = {
  I: '#00e5ff',
  O: '#ffeb3b',
  T: '#aa00ff',
  S: '#00e676',
  Z: '#ff1744',
  J: '#2979ff',
  L: '#ff9100',
};

// SPAWN[type] = { size, cells }: the spawn orientation as four [dx, dy]
// cells inside a size x size box anchored at the active tetromino's (x, y).
const SPAWN = {
  I: { size: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
  O: { size: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]] },
  T: { size: 3, cells: [[0, 0], [1, 0], [2, 0], [1, 1]] },
  S: { size: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  Z: { size: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
  J: { size: 3, cells: [[0, 0], [1, 0], [2, 0], [2, 1]] },
  L: { size: 3, cells: [[0, 0], [1, 0], [2, 0], [0, 1]] },
};

// SHAPES[type][rotation]: the four clockwise orientations, each a rotation of
// the previous one within the box.
const SHAPES = {};
for (const type of Object.keys(SPAWN)) {
  const { size, cells } = SPAWN[type];
  SHAPES[type] = [cells];
  for (let r = 1; r < 4; r++) {
    SHAPES[type].push(SHAPES[type][r - 1].map(([dx, dy]) => [size - 1 - dy, dx]));
  }
}

function randomType(random) {
  return TYPES[Math.floor(random() * TYPES.length)];
}

function spawn(type) {
  const cells = SHAPES[type][0];
  const width = Math.max(...cells.map(([dx]) => dx)) + 1;
  return { type, rotation: 0, cells, x: Math.floor((WIDTH - width) / 2), y: 0 };
}

function emptyPlayfield() {
  return Array.from({ length: HEIGHT }, () => Array(WIDTH).fill(null));
}

function newGame(random = Math.random) {
  const first = randomType(random);
  const next = randomType(random);
  return {
    status: 'playing',
    playfield: emptyPlayfield(),
    active: spawn(first),
    next,
    score: 0,
    level: 0,
    lines: 0,
  };
}

// The screen shown on load: a game waiting for `start`.
function startScreen(random = Math.random) {
  return { ...newGame(random), status: 'start' };
}

// True if the active tetromino, shifted by (dx, dy), stays inside the
// playfield walls/floor and overlaps no settled block.
function fits(playfield, active, dx, dy) {
  return active.cells.every(([cx, cy]) => {
    const x = active.x + cx + dx;
    const y = active.y + cy + dy;
    return x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT && playfield[y][x] === null;
  });
}

function moved(state, dx, dy) {
  return { ...state, active: { ...state.active, x: state.active.x + dx, y: state.active.y + dy } };
}

// Rotate by `steps` quarter turns clockwise; rejected (state unchanged) if it
// would collide. No wall kicks.
function rotated(state, steps) {
  const rotation = (state.active.rotation + steps) % 4;
  const active = { ...state.active, rotation, cells: SHAPES[state.active.type][rotation] };
  return fits(state.playfield, active, 0, 0) ? { ...state, active } : state;
}

// NES gravity: frames per row at 60 fps, indexed by level (0-18); levels
// 19-28 take 2 frames and 29+ take 1.
const GRAVITY_FRAMES = [48, 43, 38, 33, 28, 23, 18, 13, 8, 6, 5, 5, 5, 4, 4, 4, 3, 3, 3];

// Milliseconds between gravity ticks at the given level.
function gravityInterval(level) {
  const frames = level < GRAVITY_FRAMES.length ? GRAVITY_FRAMES[level] : level < 29 ? 2 : 1;
  return (frames * 1000) / 60;
}

const LINE_SCORES = [0, 40, 100, 300, 1200];
const LINES_PER_LEVEL = 10;

// Remove every full row, letting the rows above drop; returns the new
// playfield and the number of rows cleared.
function clearLines(playfield) {
  const kept = playfield.filter((row) => row.some((cell) => cell === null));
  const cleared = playfield.length - kept.length;
  const empty = Array.from({ length: cleared }, () => Array(WIDTH).fill(null));
  return { playfield: [...empty, ...kept], cleared };
}

// Settle the active tetromino into the playfield, clear full rows (scoring
// and levelling up), and spawn the next one, drawing a fresh next preview.
function lock(state, random) {
  const { active } = state;
  const playfield = state.playfield.map((row) => row.slice());
  for (const [cx, cy] of active.cells) playfield[active.y + cy][active.x + cx] = active.type;
  const { playfield: settled, cleared } = clearLines(playfield);
  const lines = state.lines + cleared;
  const spawned = spawn(state.next);
  return {
    ...state,
    status: fits(settled, spawned, 0, 0) ? state.status : 'gameover',
    playfield: settled,
    active: spawned,
    next: randomType(random),
    score: state.score + LINE_SCORES[cleared] * (state.level + 1),
    lines,
    level: Math.max(state.level, Math.floor(lines / LINES_PER_LEVEL)),
  };
}

// Gravity: fall one row; locks the moment it can fall no further (no lock delay).
function tick(state, random) {
  const fallen = fits(state.playfield, state.active, 0, 1) ? moved(state, 0, 1) : state;
  return fits(fallen.playfield, fallen.active, 0, 1) ? fallen : lock(fallen, random);
}

// Events: { type: 'left' | 'right' | 'tick' | 'start' | 'pause' | 'restart' }.
// status is 'start' | 'playing' | 'paused' | 'gameover'; movement and gravity
// only act while playing. Later tickets add rotate, soft drop and hard drop.
function update(state, event, random = Math.random) {
  switch (event.type) {
    case 'start':
      return state.status === 'start' || state.status === 'gameover' ? newGame(random) : state;
    case 'restart':
      return newGame(random);
    case 'pause':
      if (state.status === 'playing') return { ...state, status: 'paused' };
      if (state.status === 'paused') return { ...state, status: 'playing' };
      return state;
  }
  if (state.status !== 'playing') return state;
  switch (event.type) {
    case 'left':
      return fits(state.playfield, state.active, -1, 0) ? moved(state, -1, 0) : state;
    case 'right':
      return fits(state.playfield, state.active, 1, 0) ? moved(state, 1, 0) : state;
    case 'rotateCW':
      return rotated(state, 1);
    case 'rotateCCW':
      return rotated(state, 3);
    case 'tick':
      return tick(state, random);
    default:
      return state;
  }
}

const logic = { newGame, startScreen, update, gravityInterval, WIDTH, HEIGHT, TYPES, COLORS, SHAPES };
if (typeof module !== 'undefined') module.exports = logic;

</script>
<script>
// Auto-repeat (DAS) timing for held Left/Right. Pure: no DOM, no clock;
// callers pass timestamps in ms. Holds no game rules.

// Tune the feel here.
const DAS_DELAY_MS = 170; // hold time before repeating starts
const DAS_INTERVAL_MS = 50; // time between repeats once started

function createRepeater({ delay = DAS_DELAY_MS, interval = DAS_INTERVAL_MS } = {}) {
  const held = []; // held directions, most recent last
  let nextAt = 0; // when the active (most recent) direction next repeats

  return {
    // Returns the directions to move right now.
    press(dir, now) {
      if (held.includes(dir)) return [];
      held.push(dir);
      nextAt = now + delay;
      return [dir];
    },
    release(dir, now) {
      const i = held.indexOf(dir);
      if (i < 0) return;
      const wasActive = i === held.length - 1;
      held.splice(i, 1);
      if (wasActive && held.length) nextAt = now + interval;
    },
    // Returns the directions whose repeat is due by `now`.
    poll(now) {
      const moves = [];
      if (!held.length) return moves;
      const dir = held[held.length - 1];
      while (nextAt <= now) {
        moves.push(dir);
        nextAt += interval;
      }
      return moves;
    },
  };
}

const repeat = { createRepeater, DAS_DELAY_MS, DAS_INTERVAL_MS };
if (typeof module !== 'undefined') module.exports = repeat;

</script>
<script>
// High score decision and persistence. No DOM: callers pass in a storage
// object (localStorage in the browser); any storage failure is swallowed so
// the game works without it. Holds no game rules.

const HIGH_SCORE_KEY = 'tetris.highScore';

// The high score after a game reaches `score`.
function nextHighScore(high, score) {
  return score > high ? score : high;
}

function loadHighScore(storage) {
  try {
    const n = Number.parseInt(storage.getItem(HIGH_SCORE_KEY), 10);
    return n > 0 ? n : 0;
  } catch {
    return 0;
  }
}

function saveHighScore(storage, value) {
  try {
    storage.setItem(HIGH_SCORE_KEY, String(value));
  } catch {
    // storage unavailable or full: keep playing without persistence
  }
}

const highscore = { nextHighScore, loadHighScore, saveHighScore, HIGH_SCORE_KEY };
if (typeof module !== 'undefined') module.exports = highscore;

</script>
<script>
﻿// Presentation layer: rendering, keyboard input and the gravity timer.
// Holds no game rules. Uses globals from the inlined logic.js
// (newGame, update, WIDTH, HEIGHT, COLORS) and repeat.js (createRepeater).

const CELL = 30;

const canvas = document.getElementById('playfield');
canvas.width = WIDTH * CELL;
canvas.height = HEIGHT * CELL;
const ctx = canvas.getContext('2d');

let state = startScreen();

// Best score, persisted in localStorage (may be unavailable; guarded in highscore.js).
function getStorage() {
  try { return window.localStorage; } catch { return undefined; }
}
const storage = getStorage();
let highScore = loadHighScore(storage);

const OVERLAYS = {
  start: ['Press Enter to start'],
  paused: ['Paused', 'P to resume'],
  gameover: ['Game over', 'Press Enter to restart'],
};

function drawOverlay() {
  const lines = OVERLAYS[state.status];
  if (!lines) return;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(lines[0], canvas.width / 2, canvas.height / 2);
  if (lines[1]) {
    ctx.font = '18px sans-serif';
    ctx.fillText(lines[1], canvas.width / 2, canvas.height / 2 + 32);
  }
}

function drawCell(x, y, type) {
  ctx.fillStyle = COLORS[type];
  ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
}

function renderPanel() {
  const best = nextHighScore(highScore, state.score);
  if (best !== highScore) {
    highScore = best;
    saveHighScore(storage, highScore);
  }
  document.getElementById('highscore').textContent = highScore;
  for (const key of ['score', 'level', 'lines']) {
    document.getElementById(key).textContent = state[key];
  }
}

function render() {
  renderPanel();
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  state.playfield.forEach((row, y) => row.forEach((type, x) => type && drawCell(x, y, type)));
  const { active } = state;
  for (const [dx, dy] of active.cells) drawCell(active.x + dx, active.y + dy, active.type);
  drawOverlay();
  renderNext();
}

// Next preview: the upcoming tetromino in its spawn orientation.
const nextCtx = document.getElementById('next').getContext('2d');
function renderNext() {
  nextCtx.fillStyle = '#111';
  nextCtx.fillRect(0, 0, 120, 120);
  nextCtx.fillStyle = COLORS[state.next];
  for (const [dx, dy] of SHAPES[state.next][0]) {
    nextCtx.fillRect(15 + dx * 24, 15 + dy * 24, 23, 23);
  }
}

function send(event) {
  state = update(state, event);
  render();
}

const KEYS = {
  ArrowLeft: 'left',
  ArrowRight: 'right',
  ArrowUp: 'rotateCW',
  x: 'rotateCW',
  X: 'rotateCW',
  z: 'rotateCCW',
  Z: 'rotateCCW',
  Enter: 'start',
  p: 'pause',
  P: 'pause',
  r: 'restart',
  R: 'restart',
};

// Left/Right auto-repeat (DAS); timing values live in src/repeat.js.
const repeater = createRepeater();

document.addEventListener('keydown', (e) => {
  const type = KEYS[e.key];
  if (!type) return;
  e.preventDefault();
  for (const move of repeater.press(type, performance.now())) send({ type: move });
});

document.addEventListener('keyup', (e) => {
  const type = KEYS[e.key];
  if (type) repeater.release(type, performance.now());
});

window.addEventListener('blur', () => {
  for (const type of Object.values(KEYS)) repeater.release(type, performance.now());
});

setInterval(() => {
  for (const move of repeater.poll(performance.now())) send({ type: move });
}, 10);

// Gravity: re-read the interval for the current level on every check, so a
// level-up changes the fall speed immediately.
let lastFall = performance.now();
setInterval(() => {
  const now = performance.now();
  for (let n = 0; n < 5 && now - lastFall >= gravityInterval(state.level); n++) {
    lastFall += gravityInterval(state.level);
    send({ type: 'tick' });
  }
  if (now - lastFall >= gravityInterval(state.level)) lastFall = now;
}, 5);
render();

</script>
</body>
</html>
